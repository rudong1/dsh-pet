name: Windows desktop pet
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', 'client.js', 'assets/**', '.github/workflows/desktop.yml']
permissions:
  contents: read
jobs:
  windows-package:
    name: Windows download
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - name: Upload Windows download
        id: download
        uses: actions/upload-artifact@v4
        with:
          name: dsh-pet-windows-x64
          path: desktop/release/win-unpacked/
          if-no-files-found: error
      - name: Show download link
        run: 'Write-Output "[Download Windows desktop pet](${{ steps.download.outputs.artifact-url }})" >> $env:GITHUB_STEP_SUMMARY'
  windows-desktop-tests:
    name: Windows desktop tests
    runs-on: windows-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run test:desktop
