name: Windows desktop pet
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['desktop/**', 'client.js', 'assets/**', '.github/workflows/desktop.yml']
permissions:
  contents: read
jobs:
  windows-package:
    name: Windows download
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - run: npm run verify:release
      - name: Upload Windows download
        id: download
        uses: actions/upload-artifact@v4
        with:
          name: dsh-pet-windows-x64
          path: |
            desktop/release/*.exe
            desktop/release/*.exe.blockmap
            desktop/release/latest.yml
          if-no-files-found: error
      - name: Show download link
        run: 'Write-Output "[Download Windows desktop pet](${{ steps.download.outputs.artifact-url }})" >> $env:GITHUB_STEP_SUMMARY'
  windows-desktop-tests:
    name: Windows desktop tests
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run test:desktop

  publish-update:
    name: Publish desktop update
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-package, windows-desktop-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dsh-pet-windows-x64
          path: release
      - name: Publish installer and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'if (process.env.RELEASE_TAG !== "v" + require("./desktop/package.json").version) process.exit(1)'
          gh release create "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "DSH Pet Desktop $RELEASE_TAG" --notes-file desktop/RELEASE_NOTES.md --latest
